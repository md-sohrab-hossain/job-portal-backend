version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_portal_backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=5000
    networks:
      - job-portal-network
    restart: unless-stopped

networks:
  job-portal-network:
    external: true
